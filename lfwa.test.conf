# ---------------------------------------------------------------------------------------------------
# rpc.lfwa.test — the anvil JSON-RPC endpoint (port 8545).
#
# Present because scan.lfwa.test needs it, and useful in its own right: it is the URL to give MetaMask
# or any wallet you want to point at the devnet (chain id 31337). Websockets are proxied because anvil
# serves its subscription endpoint on the same port.
# ---------------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name rpc.lfwa.test;

    ssl_certificate     /home/geeksesi/public_html/services/lfwa.test/lfwa.test.crt;
    ssl_certificate_key /home/geeksesi/public_html/services/lfwa.test/lfwa.test.key;

    location / {
        proxy_pass http://127.0.0.1:8545;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

# ---------------------------------------------------------------------------------------------------
# control.lfwa.test — the devnet control service (port 3010).
#
# You do not need this for the CLI, which reaches the service inside the container. It is here so the
# cheat/adapter/market HTTP surface can be driven with curl or from a browser console.
#
# It exists only in this development stack and refuses any chain that is not 31337.
# ---------------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name control.lfwa.test;

    ssl_certificate     /home/geeksesi/public_html/services/lfwa.test/lfwa.test.crt;
    ssl_certificate_key /home/geeksesi/public_html/services/lfwa.test/lfwa.test.key;

    location / {
        proxy_pass http://127.0.0.1:3010;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
