# Marzban — co-op tower defense (4 services behind nginx + SSL)
# Issued certs live under /home/geeksesi/public_html/services/<domain>/.

map $http_upgrade $marzban_connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── HTTP → HTTPS redirects ────────────────────────────────────────────────
server {
    listen 80;
    server_name marzban.test api.marzban.test ws.marzban.test game.marzban.test;
    location / { return 301 https://$host$request_uri; }
}

# ─── Frontend (Vite dev server) ────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name marzban.test;

    ssl_certificate     /home/geeksesi/public_html/services/marzban.test/marzban.test.crt;
    ssl_certificate_key /home/geeksesi/public_html/services/marzban.test/marzban.test.key;

    # Vite app + HMR websocket.
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $marzban_connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

# ─── Laravel API ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.marzban.test;

    ssl_certificate     /home/geeksesi/public_html/services/marzban.test/marzban.test.crt;
    ssl_certificate_key /home/geeksesi/public_html/services/marzban.test/marzban.test.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# ─── Reverb (Laravel broadcast WebSocket) ──────────────────────────────────
server {
    listen 443 ssl;
    server_name ws.marzban.test;

    ssl_certificate     /home/geeksesi/public_html/services/marzban.test/marzban.test.crt;
    ssl_certificate_key /home/geeksesi/public_html/services/marzban.test/marzban.test.key;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $marzban_connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

# ─── Colyseus (game-server WebSocket + monitor) ────────────────────────────
server {
    listen 443 ssl;
    server_name game.marzban.test;

    ssl_certificate     /home/geeksesi/public_html/services/marzban.test/marzban.test.crt;
    ssl_certificate_key /home/geeksesi/public_html/services/marzban.test/marzban.test.key;

    location / {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $marzban_connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
